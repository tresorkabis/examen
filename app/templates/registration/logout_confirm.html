{% extends 'app/base.html' %}

{% block title %}Déconnexion — ExamManager{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <i class="bi bi-door-open display-5 text-secondary"></i>
                <h2 class="h4 mt-3">Se déconnecter ?</h2>
                <p class="text-muted">Votre session sera fermée sur cet appareil.</p>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-box-arrow-right me-1"></i>Confirmer la déconnexion
                    </button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary ms-2">
                        Annuler
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
